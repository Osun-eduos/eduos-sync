name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduos
          POSTGRES_PASSWORD: eduos
          POSTGRES_DB: eduos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eduos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SYNC_TEST_DATABASE_URL: postgresql://eduos:eduos@localhost:5432/eduos_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The database schema belongs to eduos-api. Apply its migrations so the store tests run against the real schema.
      - uses: actions/checkout@v4
        with:
          repository: Osun-eduos/eduos-api
          path: eduos-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply eduos-api migrations
        working-directory: eduos-api
        env:
          DATABASE_URL: ${{ env.SYNC_TEST_DATABASE_URL }}
        run: npx --yes prisma@6.19.0 migrate deploy
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /dev/null ./cmd/eduos-sync
